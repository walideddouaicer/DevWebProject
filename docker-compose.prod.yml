# Production stack (PLAN P4.7). Usage — see docs/DEPLOY.md:
#   cp .env.prod.example .env   # fill in the values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# web       gunicorn (migrates on start)          scheduler  daily jobs (reminders, digest…)
# db        PostgreSQL 16                          caddy      HTTPS (Let's Encrypt) + /media
# backup    nightly pg_dump + files archive, 14 days kept, in the `backups` volume

x-app: &app
  build: .
  image: ensa-project-manager:latest
  restart: unless-stopped
  env_file: .env
  environment:
    ENVIRONMENT: prod
    DATABASE_URL: postgres://ensa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/ensa
    DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN}
    SITE_URL: https://${DOMAIN}
    TRUSTED_PROXY_COUNT: "1"
  volumes:
    - media:/data/media
    - private:/data/private
    - appstate:/data/state
  depends_on:
    db:
      condition: service_healthy

services:
  web:
    <<: *app
    command: ["web"]

  scheduler:
    <<: *app
    command: ["scheduler"]
    environment:
      ENVIRONMENT: prod
      DATABASE_URL: postgres://ensa:${POSTGRES_PASSWORD}@db:5432/ensa
      DJANGO_ALLOWED_HOSTS: ${DOMAIN}
      SITE_URL: https://${DOMAIN}
      SCHEDULER_STATE_FILE: /data/state/scheduler.json
    healthcheck:
      disable: true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ensa
      POSTGRES_USER: ensa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ensa -d ensa"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro          # public uploads only; private files are never mounted here
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ensa
      PGDATABASE: ensa
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - backups:/backups
      - media:/files/media:ro
      - private:/files/private:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  private:
  appstate:
  backups:
  caddy_data:
  caddy_config:
