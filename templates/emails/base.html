<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}ENSA Project Manager{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#F6F4EF;color:#1B1A17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F6F4EF;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
      <tr><td style="padding:0 4px 16px;font-family:Georgia,'Times New Roman',serif;font-size:20px;color:#1F5C57;">
        <a href="{{ site_url }}" style="color:#1F5C57;text-decoration:none;">Projets ENSA</a>
      </td></tr>
      <tr><td style="background:#FFFFFF;border:1px solid #E2DED4;border-radius:10px;padding:32px 28px;">
        {% block content %}{% endblock %}
      </td></tr>
      <tr><td style="padding:16px 4px;font-size:13px;color:#6E695F;">
        {% block footer %}ENSA Project Manager — gestion des projets d'ingénieurs.{% endblock %}
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
