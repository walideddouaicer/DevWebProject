{% extends 'registration/_auth_base.html' %}
{% block title %}Changer de mot de passe{% endblock %}
{% block content %}
<h1>Changer de mot de passe</h1>
<form method="post">
  {% csrf_token %}
  {% for field in form %}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {{ field.errors }}
  {% endfor %}
  <button type="submit">Enregistrer</button>
</form>
<p><a href="{% url 'smart_redirect' %}">Retour à mon espace</a></p>
{% endblock %}
