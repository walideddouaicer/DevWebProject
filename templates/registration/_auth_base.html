{% comment %}Minimal standalone layout for account pages (PLAN P2.8); replaced by layouts/auth.html in P6.1.{% endcomment %}<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Compte{% endblock %} — ENSA Project Manager</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f6f4ef; color: #1b1a17; margin: 0; line-height: 1.5; }
    main { max-width: 28rem; margin: 4rem auto; padding: 2rem; background: #fff; border: 1px solid #e2ded4; border-radius: 10px; }
    h1 { font-size: 1.375rem; margin-top: 0; }
    label { display: block; font-weight: 600; margin: 1rem 0 .25rem; }
    input { width: 100%; box-sizing: border-box; padding: .5rem .625rem; border: 1px solid #cfc9bc; border-radius: 6px; font: inherit; }
    button { margin-top: 1.25rem; padding: .5rem 1rem; background: #1f5c57; color: #fff; border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; }
    .errorlist { color: #a8321e; padding-left: 1rem; margin: .25rem 0; }
    .help { color: #57534a; font-size: .875rem; }
    a { color: #1f5c57; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
