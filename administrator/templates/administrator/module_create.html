{% extends "layouts/app.html" %}
{% load ui %}
{% block title %}Nouveau module{% endblock %}
{% block content_class %}content-narrow{% endblock %}
{% block content %}
<header class="page-header"><div><nav class="breadcrumb" aria-label="Fil d'Ariane"><a href="{% url 'administrator:modules_list' %}">Modules</a></nav><h1>Nouveau module</h1></div></header>
<form method="post" class="card card-body stack" novalidate>
  {% csrf_token %}
  {% include "administrator/_module_fields.html" %}
  <div class="form-actions"><a class="btn btn-ghost" href="{% url 'administrator:modules_list' %}">Annuler</a><button class="btn btn-primary" type="submit">Créer le module</button></div>
</form>
{% endblock %}
